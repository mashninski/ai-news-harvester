# Этап 7 плана: коллектор → пайплайн → публикация, раз в 2 часа.
#
# Batch API асинхронный: прогон N отправляет батч, прогон N+1 его забирает
# и отправляет следующий шаг. Поэтому между прогонами должно жить состояние —
# data/state.sqlite (что уже видели, незабранные батчи, что ушло в PR) и
# output/cards (черновики, которые ещё не попали в PR). Живёт оно в
# actions/cache, а не в git: почему — журнал сайта, 25.09.2026, этап 7.
#
# Платная часть (пайплайн и публикация) выключена, пока переменная
# репозитория AI_NEWS_PIPELINE не равна «on» (Settings → Secrets and
# variables → Actions → Variables). Коллектор бесплатный и работает всегда.
#
# Два цикла в сутки (журнал сайта, 07.10.2026, «Этап 9»): новость должна
# попасть на сайт не позже чем через сутки после выхода у источника. Цикл —
# генерация, fix и публикация по одному батчу: каждый батч пишет справочный
# блок в кэш заново, батч в каждом прогоне платил бы лишние записи. UTC:
#   23:17 / 11:17  генерация отправлена
#   01:17 / 13:17  генерация забрана, чистые карточки готовы; fix отправлен
#   03:17 / 15:17  fix забран
#   05:17 / 17:17  публикация: PR с карточками, вливается сам
# Остальные нечётные часы — сбор и triage. Батч не успел к своему прогону —
# забирается следующим, а его карточки уходят в PR следующего цикла.
#
# Кто запускает. Основной путь — Worker strymy-bot в Cloudflare (репозиторий
# streaminfo-sitebot, папка worker/): в :17 нечётных часов он шлёт
# workflow_dispatch с явным видом прогона (вход kind). Расписание GitHub
# выкидывает прогоны (03–04.10.2026 — по 3 в сутки), workflow_dispatch
# ставится в очередь сразу. schedule ниже — запасной путь, на 30 минут позже:
# если Worker этот прогон уже запустил, запасной ничего не делает
# (задача plan). Часы и виды прогонов в Worker'е и здесь — одни и те же.

name: harvest
# Вид прогона в списке Actions: по нему запасной прогон находит прогон Worker'а
run-name: "${{ inputs.kind && format('harvest: {0}', inputs.kind) || 'harvest' }}"

on:
  schedule:
    # Запасной путь: минута 47, Worker запускает те же прогоны в 17.
    # Вид прогона узнаётся по строке (github.event.schedule), а не по часам:
    # прогон в очереди опаздывает. Меняешь эти строки — меняй и case
    # в шаге «Вид прогона» ниже, и часы в Worker'е (worker/src/harvest.js)
    - cron: "47 3,7,9,15,19,21 * * *"
    - cron: "47 11,23 * * *"
    - cron: "47 1,13 * * *"
    - cron: "47 5,17 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "Вид прогона: collect — сбор и triage; generate — плюс батч генерации; fix — плюс батч fix; publish — плюс PR с карточками"
        type: choice
        options: [collect, generate, fix, publish]
        default: collect
      cold_start:
        description: "Кэша состояния нет — всё равно запускать пайплайн с пустым состоянием"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PIPELINE: ${{ vars.AI_NEWS_PIPELINE }}
  # Ветка сайта, откуда берутся глоссарий и словари и куда открывается PR.
  # До запуска раздела (этап 8) — naviny-test: main фронта /naviny не содержит
  SITE_BRANCH: ${{ vars.AI_NEWS_SITE_BRANCH || 'naviny-test' }}
  # Орфография карточек: narkamauka — текст модели как есть, Node не нужен;
  # tarask — через конвертер taraskevizer. Тарашкевіца выключена решением
  # автора 02.10.2026 (журнал сайта); вернуть — переменная AI_NEWS_ORTHOGRAPHY = tarask
  AI_NEWS_ORTHOGRAPHY: ${{ vars.AI_NEWS_ORTHOGRAPHY || 'narkamauka' }}

# Раннер — ubuntu-24.04, а не ubuntu-latest: метка latest с 19.10.2026 переезжает
# на Ubuntu 26, и прогон сменил бы систему сам, без коммита. Actions — мажорные
# версии на Node 24 (Node 20 у actions устарел). Этап 12, журнал сайта, 09.10.2026;
# сверяет test_workflow_pins_runner_and_node24_actions
jobs:
  # Какой это прогон и не запущен ли он уже Worker'ом. Отдельной задачей
  # и без concurrency: запасной прогон не встаёт в очередь за идущим
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
      skip: ${{ steps.dup.outputs.skip }}
    steps:
      - name: Вид прогона
        id: kind
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_KIND: ${{ inputs.kind }}
        run: |
          case "$SCHEDULE" in
            "47 11,23 * * *") kind=generate ;;
            "47 1,13 * * *")  kind=fix ;;
            "47 5,17 * * *")  kind=publish ;;
            "")               kind="${INPUT_KIND:-collect}" ;;
            *)                kind=collect ;;
          esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Вид прогона: $kind (${GITHUB_EVENT_NAME})" | tee -a "$GITHUB_STEP_SUMMARY"

      # Запасной прогон идёт через 30 минут после Worker'а (плюс опоздание
      # очереди). Прогон Worker'а того же вида за последние 100 минут — успешный
      # или ещё идущий — значит, этот не нужен. Упал — запасной повторяет его:
      # повтор безопасен (генерация берёт только отобранное, fix не чаще
      # FIX_MIN_INTERVAL, публикация не предлагает карточку второй раз).
      # API не ответил — прогон идёт: лишний прогон дешевле пропущенного
      - name: Worker уже запустил этот прогон?
        id: dup
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.kind.outputs.kind }}
        run: |
          since=$(date -u -d '-100 minutes' +%Y-%m-%dT%H:%M:%SZ)
          found=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/harvest.yml/runs?event=workflow_dispatch&per_page=30&created=%3E%3D$since" \
            --jq "[.workflow_runs[] | select(.display_title == \"harvest: $KIND\" and (.conclusion == \"success\" or .status != \"completed\"))] | .[0].html_url // \"\"") || found=""
          if [[ -n "$found" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Этот прогон уже запустил Worker: $found — запасной не нужен" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Прогона Worker'а «$KIND» за 100 минут нет — запасной идёт сам" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  harvest:
    needs: plan
    if: ${{ needs.plan.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Два прогона одновременно прочитали бы одно состояние, и сохранился бы
    # только последний: отправленный первым батч потерялся бы вместе с оплатой
    concurrency:
      group: harvest
      cancel-in-progress: false
    env:
      KIND: ${{ needs.plan.outputs.kind }}
      GENERATE: ${{ needs.plan.outputs.kind == 'generate' }}
      FIX: ${{ needs.plan.outputs.kind == 'fix' }}
      PUBLISH: ${{ needs.plan.outputs.kind == 'publish' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Состояние — из кэша
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: |
            data/state.sqlite*
            output/cards
          # Ключ кэша неизменяем, поэтому у каждого прогона свой, а берётся
          # самый свежий по префиксу
          key: ai-news-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ai-news-state-

      # Потеря состояния при включённом пайплайне стоит денег: всё за 7 дней
      # пошло бы в triage и генерацию заново, незабранные батчи пропали бы.
      # Поэтому не молча с нуля, а красный прогон и письмо
      - name: Состояние на месте?
        id: guard
        env:
          MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
          COLD: ${{ inputs.cold_start }}
        run: |
          if [[ -n "$MATCHED" ]]; then
            echo "Состояние из кэша $MATCHED"
          elif [[ "$PIPELINE" != "on" ]]; then
            echo "::warning::Кэша состояния нет — коллектор начинает с пустого. Пайплайн выключен, денег это не стоит"
          elif [[ "$COLD" == "true" ]]; then
            echo "::warning::Кэша состояния нет — холодный старт по запросу"
          else
            echo "::error::Кэша состояния нет, а пайплайн включён. Запуск с пустым состоянием заново отправит в модель всё за 7 дней. Если так и надо — Run workflow с галкой cold_start"
            exit 1
          fi

      - name: Коллектор
        run: python collect.py

      # Секрет Actions называется ANTHROPIC_API_KEY, а переменная процесса —
      # AI_NEWS_ANTHROPIC_KEY: её читает llm.py. Имена разные намеренно, см. CLAUDE.md
      - name: Секреты платной части
        if: ${{ !cancelled() && env.PIPELINE == 'on' && steps.guard.outcome == 'success' }}
        env:
          AI_NEWS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_NEWS_SITE_TOKEN: ${{ secrets.AI_NEWS_SITE_TOKEN }}
        run: |
          ok=1
          [[ -n "$AI_NEWS_ANTHROPIC_KEY" ]] || { echo "::error::Нет секрета ANTHROPIC_API_KEY — ключ Anthropic API"; ok=0; }
          [[ -n "$AI_NEWS_SITE_TOKEN" ]] || { echo "::error::Нет секрета AI_NEWS_SITE_TOKEN — токен GitHub на mashninski-site"; ok=0; }
          [[ $ok == 1 ]]

      # Сайт приватный: глоссарий, стайлгайд и словари читаются оттуда тем же
      # токеном публикации (у него Contents: read), в этот репозиторий не копируются
      - name: Языковые ресурсы сайта
        if: ${{ !cancelled() && env.PIPELINE == 'on' && steps.guard.outcome == 'success' }}
        uses: actions/checkout@v7
        with:
          repository: mashninski/mashninski-site
          ref: ${{ env.SITE_BRANCH }}
          token: ${{ secrets.AI_NEWS_SITE_TOKEN }}
          path: site
          sparse-checkout: claude
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && env.PIPELINE == 'on' && steps.guard.outcome == 'success' && env.AI_NEWS_ORTHOGRAPHY == 'tarask' }}
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/taraskevize/package-lock.json

      - name: Конвертер
        if: ${{ !cancelled() && env.PIPELINE == 'on' && steps.guard.outcome == 'success' && env.AI_NEWS_ORTHOGRAPHY == 'tarask' }}
        working-directory: tools/taraskevize
        run: npm ci

      # !cancelled(), а не success(): упавший коллектор не должен мешать забрать
      # уже оплаченные батчи прошлого прогона
      - name: Пайплайн
        if: ${{ !cancelled() && env.PIPELINE == 'on' && steps.guard.outcome == 'success' }}
        env:
          AI_NEWS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_NEWS_SITE_REPO: ${{ github.workspace }}/site
          # Месячный бюджет в $, не задан — 28. Исчерпан — прогон зелёный, с предупреждением
          AI_NEWS_MONTHLY_BUDGET_USD: ${{ vars.AI_NEWS_MONTHLY_BUDGET_USD }}
        run: |
          args=()
          if [[ "$GENERATE" == "true" ]]; then args+=(--generate); fi
          if [[ "$FIX" == "true" ]]; then args+=(--fix); fi
          python pipeline.py "${args[@]}"

      - name: Публикация
        if: ${{ !cancelled() && env.PIPELINE == 'on' && steps.guard.outcome == 'success' && env.PUBLISH == 'true' }}
        env:
          AI_NEWS_SITE_TOKEN: ${{ secrets.AI_NEWS_SITE_TOKEN }}
        # PR вливается сразу (04.10.2026). Выключатель — переменная репозитория
        # AI_NEWS_AUTOMERGE = off: тогда PR ждёт ручного мержа
        run: |
          args=()
          if [[ "${{ vars.AI_NEWS_AUTOMERGE }}" != "off" ]]; then args+=(--merge); fi
          python publish.py --base "$SITE_BRANCH" "${args[@]}"

      - name: Публикация — не в этом прогоне
        if: ${{ !cancelled() && env.PIPELINE == 'on' && steps.guard.outcome == 'success' && env.PUBLISH != 'true' }}
        run: |
          n=$(ls output/cards/*.json 2>/dev/null | wc -l)
          msg="PR — два раза в сутки, в прогонах 05:17 и 17:17 UTC (или Run workflow с видом publish). Черновиков в кэше: $n (в том числе уже предложенные)"
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      # always(): состояние сохраняется и после упавшего шага — иначе батч,
      # отправленный до падения, был бы оплачен и потерян. Но не после
      # проваленной проверки состояния: пустой файл затёр бы настоящий кэш
      - name: Состояние — в кэш
        if: ${{ always() && steps.guard.outcome == 'success' && hashFiles('data/state.sqlite') != '' }}
        uses: actions/cache/save@v6
        with:
          path: |
            data/state.sqlite*
            output/cards
          key: ai-news-state-${{ github.run_id }}-${{ github.run_attempt }}
